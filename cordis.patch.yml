# dsh-collabridge bundle patch
#
# Mounts the collaboration bridge into the profile loader. `name` must resolve from the
# profile's node_modules, which is what `dsh plugin --profile web add <this package>`
# arranges. The plugin then owns a loopback HTTP endpoint that receives questions from
# outside (Codex) and admits them into a live collaboration session.
- insert:
    - id: collabridge
      name: 'dsh-collabridge'
